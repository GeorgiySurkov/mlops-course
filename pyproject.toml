[project]
name = "mlops-course-itmo"
version = "0.1.0"
description = "MLOps AITH 2026 coursework — Stage 0 infrastructure (self-hosted ClearML)"
requires-python = ">=3.10"
dependencies = [
    # Stage 0 only: ClearML SDK + config loading. Deps for later stages are not pulled in yet.
    "clearml==2.1.5",
    "PyYAML==6.0.1",
    "python-dotenv==1.0.1",
]

# Virtual project: config/ and scripts/ are run via `uv run`, not installed as a package.
[tool.uv]
package = false
