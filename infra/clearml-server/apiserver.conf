# Fixed admin user for headless credential creation on a local server.
# The default seeded "tests" user is a protected identity and cannot mint its own
# SDK credentials, so we define a real user here. Local / course use only —
# change the password for anything exposed.
auth {
    fixed_users {
        enabled: true
        pass_hashed: false
        users: [
            {
                username: "admin"
                password: "admin1234"
                name: "Admin"
            }
        ]
    }
}
